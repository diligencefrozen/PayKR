<body data-page-type="map" class="explorer"><header data-header></header><main id="main-content">

  <div id="map"></div>


  <div id="sidebar">
    <div id="sidebar-header">
      <form id="search-box" class="explore-search" role="search">
        <span class="search-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></svg></span>
        <input type="search" id="search-input" data-i18n-aria-label="search.input" aria-label="장소, 주소 검색" enterkeyhint="search" autocomplete="off" data-i18n-placeholder="search.placeholder" placeholder="장소, 주소 검색...">
        <button class="filter-toggle" type="button" data-i18n-aria-label="map.openFilter" aria-label="카테고리 필터 열기" aria-expanded="false" aria-controls="filter-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></svg></button>
      </form>
    </div>

    <div class="map-notes-links"><button data-notes="notice" data-i18n="map.notice"></button><button data-notes="releases" data-i18n="map.releases"></button></div>
    <div id="sidebar-content">

      <div id="search-results">
        <div id="search-results-header" hidden>
          <h3 id="search-results-title"></h3>
          <p id="search-results-count"></p>
        </div>
        <div id="search-results-list"><div id="results-host" hidden>
          <div class="list-controls"><button type="button" id="source-switch" class="secondary" hidden></button>
          </div>
          <div id="results"></div><button class="secondary" id="more-results" hidden data-i18n="search.more"></button><button class="secondary" id="retry-search" hidden data-i18n="search.retry"></button></div></div>
      </div>


      <aside data-slot="map" class="ad-space" id="sidebar-ad" hidden></aside>
    </div>
  </div>


  <div class="desktop-category-wrapper">
    <div class="nav-control-categories" id="desktop-categories">

    </div>
  </div>


  <form id="search-box-mobile" class="explore-search" role="search">
    <span class="search-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></svg></span>
    <input type="search" id="search-input-mobile" data-i18n-aria-label="search.input" aria-label="장소, 주소 검색" enterkeyhint="search" autocomplete="off" data-i18n-placeholder="search.placeholder" placeholder="장소, 주소 검색...">
        <button class="filter-toggle" type="button" data-i18n-aria-label="map.openFilter" aria-label="카테고리 필터 열기" aria-expanded="false" aria-controls="filter-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></svg></button>
  </form>


  <div class="nav-control-categories" id="mobile-categories">

  </div>

  <section id="filter-panel" data-i18n-aria-label="map.filter" aria-label="카테고리 필터" hidden>
    <div class="panel-heading"><h2 data-i18n="map.filter">카테고리</h2><button id="filter-close" class="icon-button" data-i18n-aria-label="map.closeFilter" aria-label="필터 닫기">×</button></div>
    <div id="filter-categories"></div>
    <label class="theme-setting">
      <span data-i18n="theme.label">화면 테마</span>
      <select class="theme-choice" data-theme-choice>
        <option value="system" data-i18n="theme.system">기기 설정</option>
        <option value="light" data-i18n="theme.light">라이트</option>
        <option value="dark" data-i18n="theme.dark">다크</option>
      </select>
    </label>
  </section>
  <button id="area" hidden data-i18n="map.area"></button>
  <div id="map-zoom" hidden><button id="zoom-in" data-i18n-aria-label="map.zoomIn">+</button><button id="zoom-out" data-i18n-aria-label="map.zoomOut">−</button></div>
  <button id="location-button" class="icon-button" data-i18n-aria-label="location.button" aria-label="현재 위치로 이동" data-i18n-title="location.button" title="현재 위치로 이동">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/><path d="M12 1v4m0 14v4M1 12h4m14 0h4"/></svg>
  </button>
  <section id="place-sheet" data-i18n-aria-label="place.info" aria-label="장소 정보">
    <button id="sheet-toggle" data-i18n-aria-label="place.expand" aria-label="장소 패널 펼치기" aria-expanded="false" aria-controls="sheet-content"><span></span><b id="sheet-mode"></b></button>
    <div class="sheet-summary">
      <svg class="pin-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22S3 14 3 9a9 9 0 1 1 18 0c0 5-9 13-9 13Z"/><circle cx="12" cy="9" r="3"/></svg>
      <div aria-live="polite"><h1 id="place-title" data-i18n="place.emptyTitle">이 지역의 장소 찾기</h1><p id="place-subtitle" data-i18n="place.emptyHint">지도에서 장소를 선택하면 상세 정보가 표시됩니다.</p></div>
      <button id="place-clear" class="icon-button" data-i18n-aria-label="place.clear" aria-label="장소 선택 해제" hidden>×</button>
    </div>
    <div class="mobile-notes-links"><button data-notes="notice" data-i18n="map.notice"></button><button data-notes="releases" data-i18n="map.releases"></button></div>
    <div id="sheet-content" hidden>
      <div id="detail"></div>
      <div id="mobile-results" data-i18n-aria-label="search.results" aria-label="장소 검색 결과"></div>
      <aside class="ad-space" id="place-ad" data-slot="map-mobile" hidden></aside>
    </div>
  </section>
  <dialog id="marker-dialog" data-i18n-aria-label="place.info">
    <form method="dialog"><button autofocus data-i18n="common.close"></button></form>
    <div id="marker-detail"></div>
  </dialog>
  <p id="map-status" role="status" hidden></p>
  <div class="map-load-error" id="map-failure" hidden><p data-i18n="map.unavailable"></p>
    <div class="fallback-links"><button id="retry-map" data-i18n="common.retry"></button>
    <a id="city-map" target="_blank" rel="noopener noreferrer" data-i18n="common.map"></a>
    <button id="browse-brands" data-i18n="map.browse"></button></div></div>
